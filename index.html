<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2e5a1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/app/icono-192.png">
<link rel="apple-touch-icon" href="assets/app/icono-180.png">
<title>Reliquias v0.69</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0a10; overflow: hidden; overscroll-behavior: none; }
  #juego { position: fixed; inset: 0; }
  /* pantalla de carga */
  #carga{position:fixed;inset:0;z-index:99;transition:opacity .8s;display:flex;align-items:center;justify-content:center;background:#1d3a14;transition:opacity .6s;overflow:hidden}
  #carga::before{content:"";position:absolute;inset:-30px;background:url(assets/app/fondo-carga.webp) center/cover;filter:blur(18px) brightness(.7)}
  #carga.fuera{opacity:0;pointer-events:none}
  #carga .lamina{position:relative;flex:none;width:max(100vw,min(177.7vh,175vw));aspect-ratio:1672/941;background:url(assets/app/fondo-carga.webp) center/100% 100% no-repeat;box-shadow:0 10px 40px #0009}
  /* la barra real va encima de la barra pintada en la ilustración */
  #carga .barra{position:absolute;left:23.5%;top:79.1%;width:52.6%;height:3.7%;border-radius:999px;background:#2a1708;overflow:hidden;box-shadow:inset 0 2px 5px #000b}
  #carga .barra i{position:absolute;left:0;top:0;bottom:0;width:2%;border-radius:999px;background:linear-gradient(#fff0a0,#f6c21c 55%,#d08a0a);box-shadow:0 0 12px #ffd35acc;transition:width .6s ease-out}
  /* v0.62: mensajes con humor y curiosidades debajo de la barra (se editan en frases-carga.js) */
  #carga .msg{position:absolute;z-index:2;left:50%;bottom:max(3vh,12px);width:min(92vw,760px);box-sizing:border-box;transform:translateX(-50%);text-align:center;padding:.5em 1em;border-radius:14px;background:#1a0e05b0;box-shadow:0 4px 14px #0007;transition:opacity .35s}
  #carga .msg b{display:block;font:bold clamp(10px,1.5vw,14px) Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:#f6c21c;margin-bottom:.2em}
  @media (orientation:portrait){#carga .msg{bottom:14vh}}
  #carga .msg span{font:italic clamp(12px,2vw,19px)/1.3 Georgia,serif;color:#fff6d8;text-shadow:0 2px 4px #000}
  #carga .pct{position:absolute;left:50%;top:79.1%;height:3.7%;transform:translateX(-50%);display:flex;align-items:center;font:bold clamp(10px,1.6vw,15px) Georgia,serif;color:#3a2006;text-shadow:0 1px 0 #fff8}
</style>
</head>
<body>
<div id="carga"><div class="lamina"><div class="barra"><i></i></div><div class="pct">0 %</div></div><div class="msg"><b>Cargando</b><span>Preparando la aldea…</span></div></div>
<script src="frases-carga.js"></script>
<script>
  // barra de carga: primero los archivos del juego, luego las imágenes (motor.js llama a rqCarga)
  (function(){var el=document.getElementById('carga'),bar=el.querySelector('i'),pct=el.querySelector('.pct'),caja=el.querySelector('.msg'),tit=caja.querySelector('b'),txt=caja.querySelector('span'),n=0,tot=document.querySelectorAll('script[src]').length||15;
    // v0.62: mensajes que van rotando solos (humor y curiosidades mezclados)
    var C=window.CARGA||{humor:['Preparando la aldea…'],curiosidades:[]},lista=[];
    C.humor.forEach(function(f){lista.push(['Mientras tanto…',f])});C.curiosidades.forEach(function(f){lista.push(['¿Sabías que…?',f])});
    for(var k=lista.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=lista[k];lista[k]=lista[j];lista[j]=t}
    var im=0;function otra(){var m=lista[im++%lista.length];caja.style.opacity=0;setTimeout(function(){tit.textContent=m[0];txt.textContent=m[1];caja.style.opacity=1},350)}
    if(lista.length){otra();var giro=setInterval(otra,(C.cada||2.8)*1000)}
    var maxP=0;window.rqCarga=function(p){p=Math.max(maxP,Math.min(1,p));maxP=p;bar.style.width=Math.max(2,p*100)+'%';pct.textContent=Math.round(p*100)+' %'};
    document.addEventListener('load',function(e){if(e.target.tagName==='SCRIPT'){n++;rqCarga(.35*n/tot)}},true);
    var t0=Date.now(),MIN=(C.minimo||5.5)*1000;window.rqCargaFin=function(){if(window.rqFinYa)return;window.rqFinYa=1;var espera=Math.max(0,MIN-(Date.now()-t0));setTimeout(function(){rqCarga(1);clearInterval(giro);setTimeout(function(){el.classList.add('fuera');setTimeout(function(){el.remove()},800)},700)},espera)};
    setTimeout(function(){window.rqCargaFin&&rqCargaFin()},20000);
    if(location.hash==='#carga'){window.rqCargaFin=function(){};}   // solo para ver la pantalla de carga quieta
    if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
  })();
</script>
<div id="juego"></div>
<!-- El orden importa: primero lo editable, al final el motor -->
<!-- personajes.js va ANTES del motor: es quien dibuja a todos -->
<script src="arte.js"></script>
<script src="config.js"></script>
<script src="niveles.js"></script>
<script src="aldea.js"></script>
<script src="mundo.js"></script>
<script src="equipo.js"></script>
<script src="taller.js"></script>
<script src="personajes.js"></script>
<script src="musica.js"></script>
<script src="arte_iso.js"></script>
<script src="zumos.js"></script>
<script src="economia.js"></script>
<script src="torre.js"></script>
<script src="final.js"></script>
<script src="combate.js"></script>
<script src="red.js"></script>
<script src="motor.js"></script>

</body>
</html>
